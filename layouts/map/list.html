{{ define "main" }}
<article class="max-w-none">
  <h1 class="mb-6 text-3xl font-extrabold">{{ .Title }}</h1>
  {{ .Content }}

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <div id="travel-map" class="my-6 h-[32rem] w-full rounded-lg overflow-hidden"></div>

  {{ $posts := where site.RegularPages "Type" "posts" }}
  <script>
  (function () {
    var map = L.map('travel-map').setView([38.7223, -9.1393], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    var pins = [
      {{ range $posts }}
      {{ if and .Params.lat .Params.lon }}
      { lat: {{ .Params.lat }}, lon: {{ .Params.lon }}, title: {{ .Title | jsonify }}, url: {{ .RelPermalink | jsonify }}, location: {{ .Params.location | default "" | jsonify }} },
      {{ end }}
      {{ end }}
    ];

    pins.forEach(function (p) {
      var popup = '<a href="' + p.url + '"><strong>' + p.title + '</strong></a>' + (p.location ? '<br>' + p.location : '');
      L.marker([p.lat, p.lon]).addTo(map).bindPopup(popup);
    });
  })();
  </script>
</article>
{{ end }}
