{{ define "main" }}
<article class="max-w-none">
  <h1 class="mb-6 text-3xl font-extrabold">{{ .Title }}</h1>
  {{ .Content }}

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.3.1/css/glightbox.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.3.1/js/glightbox.min.js"></script>

  <div id="travel-map" class="my-6 h-[32rem] w-full rounded-lg overflow-hidden"></div>

  {{ $pins := partial "gps-pins.html" . }}

  <script>
  (function () {
    var map = L.map('travel-map').setView([38.7223, -9.1393], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    var photoPins = {{ $pins.photoPins | jsonify | safeJS }};
    var postPins = {{ $pins.postPins | jsonify | safeJS }};

    // Group photos taken close together (~11m, 4 decimal places) into one pin
    var groups = {};
    photoPins.forEach(function (p) {
      var key = p.lat.toFixed(4) + ',' + p.lon.toFixed(4);
      if (!groups[key]) {
        groups[key] = { lat: p.lat, lon: p.lon, photos: [], postURLs: {} };
      }
      groups[key].photos.push(p);
      groups[key].postURLs[p.postURL] = true;
    });

    Object.keys(groups).forEach(function (key) {
      var group = groups[key];
      var cover = group.photos[0];
      var count = group.photos.length;
      var html =
        '<div class="photo-pin">' +
          '<img src="' + cover.thumb + '" alt="">' +
          (count > 1 ? '<span class="photo-pin-count">' + count + '</span>' : '') +
        '</div>';
      var icon = L.divIcon({ html: html, className: 'photo-pin-wrapper', iconSize: [52, 52] });

      L.marker([group.lat, group.lon], { icon: icon }).addTo(map).on('click', function () {
        var lightbox = GLightbox({
          elements: group.photos.map(function (p) {
            return { href: p.full, type: 'image' };
          })
        });
        lightbox.open();
      });
    });

    // Fallback pins for posts without any GPS-tagged photos
    postPins.forEach(function (p) {
      var alreadyShown = photoPins.some(function (photo) { return photo.postURL === p.postURL; });
      if (alreadyShown) return;
      var popup = '<a href="' + p.postURL + '"><strong>' + p.postTitle + '</strong></a>' + (p.location ? '<br>' + p.location : '');
      L.marker([p.lat, p.lon]).addTo(map).bindPopup(popup);
    });
  })();
  </script>
</article>
{{ end }}
