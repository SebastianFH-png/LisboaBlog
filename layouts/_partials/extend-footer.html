<div id="cursor-glow" class="pointer-events-none fixed left-0 top-0 z-0 h-40 w-40 rounded-full opacity-0 blur-xl transition-opacity duration-700"></div>

<script>
(function () {
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var glow = document.getElementById("cursor-glow");
  if (glow && !reduceMotion) {
    var visible = false;
    window.addEventListener("mousemove", function (e) {
      glow.style.transform = "translate(" + (e.clientX - 80) + "px," + (e.clientY - 80) + "px)";
      // hide the glow over photos and maps so it doesn't tint them
      var overImage = e.target.closest && e.target.closest("img, picture, .polaroid, .cork-photo, #hero, .leaflet-container, #mini-map");
      if (visible === !overImage) return;
      visible = !overImage;
      glow.style.opacity = visible ? "1" : "0";
    }, { passive: true });
  }
})();
</script>

<script>
(function () {
  var header = document.getElementById("site-header");
  if (header) {
    // lets the home hero fill exactly the screen below the header
    var setHeaderHeight = function () {
      document.documentElement.style.setProperty("--header-h", header.offsetHeight + "px");
    };
    setHeaderHeight();
    window.addEventListener("resize", setHeaderHeight, { passive: true });
    // Home: solid header (and matching browser bar color) only once the hero photo is scrolled past
    var hero = document.getElementById("hero");
    var themeMeta = document.querySelector("meta[name=theme-color]");
    var solidThemeColor = themeMeta && themeMeta.getAttribute("content");
    var updateHeader = function () {
      header.classList.toggle("is-scrolled", window.scrollY > 8);
      if (!hero) return;
      // transparent only while the hero photo is the main view (solid from the stats on)
      var solid = window.scrollY > hero.offsetHeight * 0.25;
      if (solid === header.classList.contains("is-solid")) return;
      header.classList.toggle("is-solid", solid);
      if (themeMeta) {
        if (solid) themeMeta.setAttribute("content", solidThemeColor);
        else { solidThemeColor = themeMeta.getAttribute("content"); themeMeta.setAttribute("content", "#1f1a16"); }
      }
    };
    window.addEventListener("scroll", updateHeader, { passive: true });
    window.addEventListener("resize", updateHeader, { passive: true });
    if (hero && themeMeta) themeMeta.setAttribute("content", "#1f1a16");
    updateHeader();
  }

  var targets = Array.prototype.filter.call(
    document.querySelectorAll("article h2, article p, article figure, article img, .fade-in-up"),
    function (el) { return !el.closest(".cork-wall"); }
  );
  if ("IntersectionObserver" in window && targets.length) {
    targets.forEach(function (el) { el.classList.add("fade-in-up"); });
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    targets.forEach(function (el) { observer.observe(el); });
  } else {
    targets.forEach(function (el) { el.classList.add("is-visible"); });
  }
})();
</script>
