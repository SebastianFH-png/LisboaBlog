<div id="cursor-glow" class="pointer-events-none fixed left-0 top-0 z-0 h-[32rem] w-[32rem] rounded-full opacity-0 blur-3xl transition-opacity duration-700"></div>

<script>
(function () {
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var glow = document.getElementById("cursor-glow");
  if (glow && !reduceMotion) {
    var shown = false;
    window.addEventListener("mousemove", function (e) {
      glow.style.transform = "translate(" + (e.clientX - 256) + "px," + (e.clientY - 256) + "px)";
      if (!shown) { shown = true; glow.style.opacity = "1"; }
    }, { passive: true });
  }
})();
</script>

<script>
(function () {
  var header = document.getElementById("site-header");
  if (header) {
    window.addEventListener("scroll", function () {
      header.classList.toggle("is-scrolled", window.scrollY > 8);
    }, { passive: true });
  }

  var targets = document.querySelectorAll("article h2, article p, article figure, article img, .fade-in-up");
  if ("IntersectionObserver" in window && targets.length) {
    targets.forEach(function (el) { el.classList.add("fade-in-up"); });
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    targets.forEach(function (el) { observer.observe(el); });
  } else {
    targets.forEach(function (el) { el.classList.add("is-visible"); });
  }
})();
</script>
